services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: faradhaven-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faradhaven
    ports:
      - "5432:5432"
    volumes:
      - faradhaven_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  faradhaven_data:
